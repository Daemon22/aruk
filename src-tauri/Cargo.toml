[package]
name = "aruk"
version = "0.2.0"
description = "Aruk — Keeper of Secrets and Keys"
authors = ["Aruk"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "aruk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = ["codegen"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-single-instance = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = ["rt", "time", "net", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
dirs = "6"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
