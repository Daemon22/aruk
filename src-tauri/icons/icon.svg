<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="key" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="120" height="120" rx="28" fill="url(#bg)"/>

  <!-- Subtle inner border glow -->
  <rect x="2" y="2" width="116" height="116" rx="26" stroke="url(#shield)" stroke-width="2" fill="none"/>

  <!-- Shield / Bank Vault shape -->
  <path d="M60 28 L85 40 L85 65 C85 78 73.5 88 60 94 C46.5 88 35 78 35 65 L35 40 Z" 
        fill="url(#shield)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>

  <!-- Key icon inside shield -->
  <!-- Key head (circle) -->
  <circle cx="52" cy="56" r="9" fill="none" stroke="url(#key)" stroke-width="3" stroke-linecap="round"/>
  <!-- Key shaft -->
  <line x1="59.5" y1="60.5" x2="80" y2="70" stroke="url(#key)" stroke-width="3" stroke-linecap="round"/>
  <!-- Key teeth -->
  <line x1="73" y1="70" x2="73" y2="76" stroke="url(#key)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="78" y1="72" x2="78" y2="78" stroke="url(#key)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- "AB" monogram hint - subtle dots pattern (circuit/routing feel) -->
  <circle cx="44" cy="44" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="50" cy="42" r="1" fill="white" opacity="0.3"/>
  <circle cx="68" cy="44" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="76" cy="50" r="1" fill="white" opacity="0.3"/>
  <circle cx="42" cy="68" r="1" fill="white" opacity="0.3"/>
  <circle cx="78" cy="64" r="1" fill="white" opacity="0.3"/>
  <circle cx="60" cy="82" r="1.5" fill="white" opacity="0.4"/>
</svg>