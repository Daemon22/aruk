# ============================================================
# Aruk — docker-compose for personal deployment
# ============================================================
# Usage:
#   docker compose up -d          # Start Aruk
#   docker compose logs -f         # Follow logs
#   docker compose down            # Stop
#   docker compose up -d --build  # Rebuild and restart
# ============================================================

services:
  aruk:
    build: .
    container_name: aruk
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - DATABASE_URL=file:/app/data/aruk.db
      - APIBANK_URL=http://localhost:3000
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - aruk-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  aruk-data:
    driver: local
