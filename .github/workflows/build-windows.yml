name: Build Aruk Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      BUN_VERSION: 1.3.14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate
      - name: Run tests
        run: bun run test
      - name: Generate Next.js types
        run: bunx next typegen
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Build application
        run: bun run build
      - name: Prepare Tauri server bundle
        run: bun run tauri:prepare

      - name: Bundle Bun runtime
        run: |
          $bunUrl = "https://github.com/oven-sh/bun/releases/download/bun-v${env:BUN_VERSION}/bun-windows-x64.zip"
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Invoke-WebRequest -Uri $bunUrl -OutFile bun.zip
          Expand-Archive -Path bun.zip -DestinationPath bun-temp -Force
          Copy-Item "bun-temp/bun-windows-x64/bun.exe" "src-tauri/binaries/bun-x86_64-pc-windows-msvc.exe"
          Remove-Item -Recurse -Force bun.zip, bun-temp

      - name: Build Tauri installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Aruk v__VERSION__'
          releaseDraft: true
          prerelease: false

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Aruk-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
