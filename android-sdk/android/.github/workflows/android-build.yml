name: Android Build

on:
  push:
    branches: [main, develop]
    paths:
      - 'android/**'
      - 'src/lib/sdk/**'
      - 'prisma/schema.prisma'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [debug, release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/libs.versions.toml') }}
          restore-keys: gradle-android-

      - name: Grant execute permission
        run: chmod +x android/gradlew 2>/dev/null || true

      - name: Build aruk-core
        working-directory: android
        run: ./gradlew :aruk-core:assemble${{ matrix.variant == 'release' && 'Release' || 'Debug' }} --stacktrace

      - name: Build aruk-ui
        working-directory: android
        run: ./gradlew :aruk-ui:assemble${{ matrix.variant == 'release' && 'Release' || 'Debug' }} --stacktrace

      - name: Build APK
        working-directory: android
        run: ./gradlew :aruk-app:assemble${{ matrix.variant == 'release' && 'Release' || 'Debug' }} --stacktrace

      - name: Run unit tests
        working-directory: android
        run: ./gradlew test${{ matrix.variant == 'release' && 'ReleaseUnitTest' || 'DebugUnitTest' }} --stacktrace

      - name: Upload APK artifact
        if: matrix.variant == 'debug' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: aruk-android-debug
          path: android/aruk-app/build/outputs/apk/debug/*.apk
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release AAB
        working-directory: android
        run: |
          ./gradlew :aruk-app:bundleRelease --stacktrace

      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew :aruk-app:assembleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: aruk-android-release
          path: |
            android/aruk-app/build/outputs/apk/release/*.apk
            android/aruk-app/build/outputs/bundle/release/*.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v0.2.0
          name: "Aruk Android v0.2.0"
          files: |
            android/aruk-app/build/outputs/apk/release/*.apk
            android/aruk-app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
